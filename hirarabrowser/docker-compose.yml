# HiraraBrowser — headless browser tools for agents (HTTP + MCP).
#
# Bound to loopback. Needs Chromium (installed in the image via Playwright).

name: hirarabrowser

services:
  hirarabrowser:
    build:
      context: ..
      dockerfile: hirarabrowser/Dockerfile
    restart: unless-stopped
    environment:
      - CBRO_HEADLESS=${CBRO_HEADLESS:-true}
      - CBRO_NAV_TIMEOUT=${CBRO_NAV_TIMEOUT:-30}
      - CBRO_MAX_SESSIONS=${CBRO_MAX_SESSIONS:-8}
      - CBRO_SESSION_TTL=${CBRO_SESSION_TTL:-600}
      - CBRO_ALLOW_PRIVATE_URLS=${CBRO_ALLOW_PRIVATE_URLS:-false}
    ports:
      - "127.0.0.1:${CBRO_PORT:-8700}:8700"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8700/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    shm_size: "256mb"

networks:
  internal:
    driver: bridge
