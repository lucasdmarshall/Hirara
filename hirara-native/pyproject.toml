[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "hirara-native"
version = "0.2.0"
requires-python = ">=3.11"
description = "Rust implementations of Hirara files, documents, search, math and SQL tools"
license = "Apache-2.0"
authors = [{name = "Kaung Myat San", email = "dev.kaungmyatsan@gmail.com"}]

[project.optional-dependencies]
pdf = ["pypdfium2>=4"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "hirara_native"
locked = true
