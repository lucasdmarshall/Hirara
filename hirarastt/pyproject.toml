[project]
name = "hirarastt"
version = "0.1.0"
description = "Free open-source speech-to-text tool for AI agents — Whisper via HTTP and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Lucas D Marshall (Kaung Myat San)" }]
keywords = [
    "llm",
    "agent",
    "mcp",
    "stt",
    "speech-to-text",
    "whisper",
    "transcription",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "faster-whisper>=1.1",
    "httpx>=0.28",
    # The shared SSRF guard + safe downloader. audio_url fetches go through
    # this so the tool cannot re-open the egress hole every URL fetcher risks.
    "hirara-core>=0.1",
]

[project.optional-dependencies]
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
mcp = ["mcp>=2.0"]
# Original OpenAI Whisper as an optional alternate backend.
openai-whisper = ["openai-whisper>=20240930"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/lucasdmarshall/Hirara"
Repository = "https://github.com/lucasdmarshall/Hirara"
Issues = "https://github.com/lucasdmarshall/Hirara/issues"

[project.scripts]
hirarastt-mcp = "hirarastt.mcp_server:main"

[project.entry-points."hirara.backends"]
hirarastt = "hirarastt.tools"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
