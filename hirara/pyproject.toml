[project]
name = "hirara"
version = "0.2.0"
description = "Python SDK for Hirara agent tools — run web/PDF/Office tools in-process, or call a self-hosted hub"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Lucas D Marshall (Kaung Myat San)" }]
keywords = ["llm", "agent", "mcp", "tool-hub", "client", "sdk", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Local mode: run the pure-library tools in this process, no hub required.
# Each package pulls hirara-core (the shared SSRF guard) transitively.
local = [
    "hirara-web>=0.1.0",
    "hirarapdf>=0.1.0",
    "hirarareader>=0.1.0",
    "hiraranet>=0.1.0",
]
# Heavier, model-backed tools — opt in only if you want them in-process.
ocr = ["hiraraocr>=0.1.0"]
stt = ["hirarastt>=0.1.0"]
all = ["hirara[local]", "hirara[ocr]", "hirara[stt]"]

[project.urls]
Homepage = "https://github.com/lucasdmarshall/Hirara"
Repository = "https://github.com/lucasdmarshall/Hirara"
Issues = "https://github.com/lucasdmarshall/Hirara/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
