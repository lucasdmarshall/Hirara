name: Publish Docker images

# Builds every Hirara tool + the hub gateway and pushes them to the GitHub
# Container Registry (ghcr.io/<owner>/hirara-*). Uses the built-in GITHUB_TOKEN,
# so there are no secrets to configure.
#
# Triggers:
#   - pushing a version tag (v0.1.0, ...) -> images tagged with that version + latest
#   - manual run from the Actions tab      -> images tagged latest
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hirara-web
            dockerfile: Dockerfile
          - name: hirara-hub
            dockerfile: hirara-hub/Dockerfile
          - name: hirara-pdf
            dockerfile: hirarapdf/Dockerfile
          - name: hirara-code
            dockerfile: hiraracode/Dockerfile
          - name: hirara-ocr
            dockerfile: hiraraocr/Dockerfile
          - name: hirara-reader
            dockerfile: hirarareader/Dockerfile
          - name: hirara-net
            dockerfile: hiraranet/Dockerfile
          - name: hirara-browser
            dockerfile: hirarabrowser/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase owner; github.repository_owner already is.
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Every tool's Dockerfile expects the repo root as its build context
          # (it copies the shared hirara-core package in), so context is always ".".
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
