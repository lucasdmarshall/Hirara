name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.7,<2'
      - run: maturin build --release --locked --manifest-path hirara-native/Cargo.toml --out native-dist
      - uses: actions/upload-artifact@v4
        with:
          name: hirara-native-linux
          path: native-dist/*.whl
          if-no-files-found: error
  unit:
    needs: native-wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [., hirara-core, hirara, hirara-hub, hiraracode, hirarabrowser,
                  hirarahttp, hiraranet, hirarafs, hiraraops, hiraradb, hirarautil,
                  hirarapdf, hirarareader, hiraraocr, hirarastt, hiraraaudio,
                  hiraradata, hiraramedia, hiraraagent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: contains(fromJSON('[".", "hirarafs", "hirarautil", "hiraradb", "hirara"]'), matrix.package)
        with:
          name: hirara-native-linux
          path: native-wheel
      - name: Install Rust tool implementations
        if: contains(fromJSON('[".", "hirarafs", "hirarautil", "hiraradb", "hirara"]'), matrix.package)
        run: python -m pip install native-wheel/*.whl 'pypdfium2>=4'
      - name: Native test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg graphviz espeak-ng libzbar0 libsndfile1 poppler-utils
      - name: Install package and shared test dependencies
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python -m pip install -c constraints-release.txt -e './hirara-core[dev]' 'mcp>=2.3,<3' fastapi python-multipart
          if [ "$PACKAGE" = hirara ]; then
            python scripts/install_dev.py --sdk --skip-native
          else
            python -m pip install -c constraints-release.txt -e "./$PACKAGE[dev,service,mcp]"
          fi
      - name: Package tests
        working-directory: ${{ matrix.package }}
        run: python -m pytest -q -o asyncio_default_fixture_loop_scope=function
  compatibility:
    needs: native-wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: hirara-native-linux
          path: native-wheel
      - run: python -m pip install native-wheel/*.whl 'pypdfium2>=4'
      - run: python scripts/install_dev.py --sdk --skip-native
      - run: |
          for package in hirara-core hirara-hub hirara; do
            (cd "$package" && python -m pytest -q -o asyncio_default_fixture_loop_scope=function)
          done
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints-release.txt -e './hirara-core[dev]' -e './hiraracode[dev]' -e './hirarabrowser[dev]' -e './hirara-hub[dev,mcp]'
      - run: python -m playwright install --with-deps chromium
      - run: docker pull python:3.12-slim
      - name: Real Docker, browser and MCP checks
        env:
          HIRARA_INTEGRATION: '1'
        run: python -m pytest -q integration -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function

  native:
    needs: native-wheel
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: hirara-test
          POSTGRES_DB: hirara
        ports: [15432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: hirara-test
          MYSQL_DATABASE: hirara
        ports: [13306:3306]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -phirara-test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path hirara-native/Cargo.toml --check
      - run: cargo clippy --manifest-path hirara-native/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path hirara-native/Cargo.toml --locked
      - uses: actions/download-artifact@v4
        with:
          name: hirara-native-linux
          path: native-wheel
      - run: python -m pip install -c constraints-release.txt native-wheel/*.whl 'pypdfium2>=4'  -e './hirara-core[dev]' -e './hiraradb[dev]' -e './hirarafs[mcp]' -e './hirarautil[mcp]' -e '.[mcp]'
      - name: PostgreSQL and MySQL integration
        env:
          HIRARA_DATABASE_INTEGRATION: '1'
        run: python -m pytest -q integration/test_native_databases.py -o asyncio_mode=auto
      - name: Native tools over MCP stdio
        env:
          HIRARA_NATIVE_INTEGRATION: '1'
        run: python -m pytest -q integration/test_native_mcp.py -o asyncio_mode=auto

  connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path hirara-connectors/Cargo.toml --check
      - run: cargo clippy --manifest-path hirara-connectors/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path hirara-connectors/Cargo.toml --locked
      - run: cargo build --manifest-path hirara-connectors/Cargo.toml --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints-release.txt -e './hirara-core[dev]' -e './hirara-hub[mcp]'
      - name: Rust connectors over the MCP hub
        env:
          HIRARA_CONNECTOR_INTEGRATION: '1'
        run: python -m pytest -q integration/test_connectors_mcp.py -o asyncio_mode=auto
