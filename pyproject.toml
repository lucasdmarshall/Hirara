[project]
name = "hirara-web"
version = "0.4.0"
description = "Self-hosted web_search and web_fetch tools for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Lucas D Marshall (Kaung Myat San)" }]
keywords = ["llm", "agent", "mcp", "hirara-web", "web-fetch", "searxng", "ssrf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28",
    "trafilatura>=2.0",
    "pypdf>=5.0",
    # Shared SSRF guard. Repo-local package (hirara-web/hirara-core), not on
    # PyPI — install it first: pip install -e hirara-core
    "hirara-core>=0.3",
]

[project.optional-dependencies]
native = ["hirara-native>=0.2,<0.3"]
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/lucasdmarshall/Hirara"
Repository = "https://github.com/lucasdmarshall/Hirara"
Issues = "https://github.com/lucasdmarshall/Hirara/issues"

[project.scripts]
hirara-web-mcp = "hiraraweb.mcp_server:main"

# In-process backend for the hirara SDK's local mode (pip install hirara[local]).
[project.entry-points."hirara.backends"]
hirara-web = "hiraraweb.tools"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
