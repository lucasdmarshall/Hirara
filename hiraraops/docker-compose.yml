# HiraraOps — self-hosted ops tools for agents (HTTP + MCP).
#
# v1: application_logs. Bound to loopback. Mount log files under /logs.

name: hiraraops

services:
  hiraraops:
    build:
      context: ..
      dockerfile: hiraraops/Dockerfile
    restart: unless-stopped
    environment:
      - COPS_ROOTS=${COPS_ROOTS:-/logs}
      - COPS_ALLOW_ANY_PATH=${COPS_ALLOW_ANY_PATH:-false}
      - COPS_LOG_SOURCES=${COPS_LOG_SOURCES:-}
      - COPS_DEFAULT_LINES=${COPS_DEFAULT_LINES:-100}
      - COPS_MAX_LINES=${COPS_MAX_LINES:-5000}
      - COPS_MAX_BYTES=${COPS_MAX_BYTES:-2000000}
    volumes:
      - ${COPS_LOGS:-./logs}:/logs:ro
    ports:
      - "127.0.0.1:${COPS_PORT:-9200}:9200"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9200/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge
