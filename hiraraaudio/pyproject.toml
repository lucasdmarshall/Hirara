[project]
name = "hiraraaudio"
version = "0.1.0"
description = "Self-hosted audio tools for AI agents — profile, check, fix, compare, find, split, watch — over HTTP and MCP, no ML models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Lucas D Marshall (Kaung Myat San)" }]
keywords = [
    "llm",
    "agent",
    "mcp",
    "audio",
    "ffmpeg",
    "loudness",
    "self-hosted",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.26",
    "httpx>=0.28",
    # Shared SSRF guard. Repo-local package, install it first:
    # pip install -e hirara-core
    "hirara-core>=0.1",
]

[project.optional-dependencies]
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/lucasdmarshall/Hirara"
Repository = "https://github.com/lucasdmarshall/Hirara"
Issues = "https://github.com/lucasdmarshall/Hirara/issues"

[project.scripts]
hiraraaudio-mcp = "hiraraaudio.mcp_server:main"

[project.entry-points."hirara.backends"]
hiraraaudio = "hiraraaudio.tools"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
