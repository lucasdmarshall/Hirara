[project]
name = "hirarareader"
version = "0.2.0"
description = "Self-hosted Office-document reader for AI agents — docx/pptx/xlsx to text, over HTTP and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Lucas D Marshall (Kaung Myat San)" }]
keywords = [
    "llm",
    "agent",
    "mcp",
    "docx",
    "pptx",
    "xlsx",
    "office",
    "self-hosted",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
]
dependencies = [
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "httpx>=0.28",
    # Shared SSRF guard + safe downloader. file_url fetches go through this so
    # the tool cannot re-open the egress hole every URL fetcher risks.
    "hirara-core>=0.2",
]

[project.optional-dependencies]
# Outlook .msg support for email_read (.eml and mbox need nothing extra).
msg = ["extract-msg>=0.48"]
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/lucasdmarshall/Hirara"
Repository = "https://github.com/lucasdmarshall/Hirara"
Issues = "https://github.com/lucasdmarshall/Hirara/issues"

[project.scripts]
hirarareader-mcp = "hirarareader.mcp_server:main"

# In-process backend for the hirara SDK's local mode (pip install hirara[local]).
[project.entry-points."hirara.backends"]
hirarareader = "hirarareader.tools"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
