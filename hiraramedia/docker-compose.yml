# HiraraMedia — video, image and barcode tools for agents (HTTP + MCP).
#
# Bound to loopback: put your own auth in front before exposing this. Files to
# analyse go in the `data` volume (or bind-mount a host folder at /data) and
# are named by their /data/... path.

name: hiraramedia

services:
  hiraramedia:
    build:
      # Context is the repo root so the build can reach the shared
      # hirara-core package (a sibling of this tool's directory).
      context: ..
      dockerfile: hiraramedia/Dockerfile
    restart: unless-stopped
    environment:
      - HM_ALLOW_LOCAL_PATH=${HM_ALLOW_LOCAL_PATH:-true}
      - HM_ALLOW_OUTPUT_PATH=${HM_ALLOW_OUTPUT_PATH:-true}
      # file_url fetches through hirara-core's SSRF guard (resolve-then-pin,
      # redirect re-validation, streamed byte cap). Off by default.
      - HM_ALLOW_URL_FETCH=${HM_ALLOW_URL_FETCH:-false}
      - HM_MAX_BYTES=${HM_MAX_BYTES:-1073741824}
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:${HM_PORT:-9500}:9500"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9500/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  data:
