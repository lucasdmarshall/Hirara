[package]
name = "hirara-connectors"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Persistent MCP discovery and connection gateway for Hirara"

[dependencies]
axum = { version = "0.8", features = ["form"] }
tokio = { version = "1", features = ["full"] }
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "server", "transport-io", "auth", "reqwest", "transport-streamable-http-client"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
http = "1"
futures = "0.3"
sse-stream = "0.2"
async-trait = "0.1"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
tempfile = "3"
fs2 = "0.4"
scraper = "0.24"
jsonschema = { version = "0.33", default-features = false }

[profile.dev]
debug = 0
incremental = false
[profile.release]
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
