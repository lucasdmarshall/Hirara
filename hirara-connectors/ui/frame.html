<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Connect through Hirara</title>
    <link
      rel="preload"
      href="/local/assets/poppins-regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <style nonce="{{NONCE}}">
      {{STYLE}}
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="brand" aria-label="Hirara">
        <div class="aurora aurora-one" aria-hidden="true"></div>
        <div class="aurora aurora-two" aria-hidden="true"></div>
        <div class="brand-grid" aria-hidden="true"></div>
        <a class="brand-label" href="/local"
          ><span class="brand-spark"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2v20M2 12h20M5 5l14 14M5 19 19 5" /></svg
          ></span>
          HIRARA <span class="brand-label-light">/ CONNECT</span></a
        >
        <div class="brand-art">
          <img
            src="/local/assets/hirara-logo.png"
            alt="Hirara — the serpent and sun"
            width="360"
            height="360"
          />
        </div>
        <div class="brand-copy">
          <span class="eyebrow">LESS FRICTION. MORE POSSIBILITY.</span>
          <h2>Your tools.<br />Your next idea.</h2>
          <p>
            Bring the tools you love into<br />the conversations that move you
            forward.
          </p>
        </div>
        <div class="brand-footer">
          <span class="tiny-orbit" aria-hidden="true"></span> One connection. A
          world of possibilities.
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <nav aria-label="Breadcrumb">
            <a href="/local">Connectors</a><span aria-hidden="true">/</span
            ><span>Connection setup</span>
          </nav>
          <span class="session-label"
            ><span aria-hidden="true"></span>Local companion</span
          >
        </header>
        <main id="main">
          <div class="content" id="content">{{CONTENT}}</div>
          <p id="notice" class="notice" role="status" aria-live="polite"></p>
        </main>
        <footer class="workspace-footer">
          <span>Made for your workflow.</span
          ><span
            >Powered by <strong>Hirara</strong
            ><span class="footer-spark"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2v20M2 12h20M5 5l14 14M5 19 19 5" /></svg></span
          ></span>
        </footer>
      </div>
    </div>
    <script nonce="{{NONCE}}">{{SCRIPT}}</script>
  </body>
</html>
