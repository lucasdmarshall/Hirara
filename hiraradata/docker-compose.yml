# HiraraData — data profiling, charts and diagrams for agents (HTTP + MCP).
#
# Bound to loopback: put your own auth in front before exposing this. Files to
# analyse go in the `data` volume (or bind-mount a host folder at /data) and
# are named by their /data/... path.

name: hiraradata

services:
  hiraradata:
    build:
      # Context is the repo root so the build can reach the shared
      # hirara-core package (a sibling of this tool's directory).
      context: ..
      dockerfile: hiraradata/Dockerfile
    restart: unless-stopped
    environment:
      - HD_ALLOW_LOCAL_PATH=${HD_ALLOW_LOCAL_PATH:-true}
      - HD_ALLOW_OUTPUT_PATH=${HD_ALLOW_OUTPUT_PATH:-true}
      # file_url fetches through hirara-core's SSRF guard (resolve-then-pin,
      # redirect re-validation, streamed byte cap). Off by default.
      - HD_ALLOW_URL_FETCH=${HD_ALLOW_URL_FETCH:-false}
      - HD_MAX_BYTES=${HD_MAX_BYTES:-524288000}
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:${HD_PORT:-9400}:9400"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9400/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  data:
